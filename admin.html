<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eva Earning - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        h1 { color: #3b82f6; font-size: 22px; }
        .refresh-btn { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .refresh-btn:hover { background: #1d4ed8; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { background: #0f172a; color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
        tr:hover { background: #334155/30; }
        .ip-badge { background: #ef4444; color: white; padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 11px; margin-top: 4px; display: inline-block; }
        .btn-approve { background: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-right: 6px; }
        .btn-reject { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-approve:hover { background: #059669; }
        .btn-reject:hover { background: #dc2626; }
        .status-badge { font-weight: 700; padding: 4px 10px; border-radius: 6px; font-size: 12px; display: inline-block; }
        .status-Approved { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid #10b981; }
        .status-Rejected { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; }
        .status-Pending { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid #f59e0b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>💸 Withdraw Requests Panel</h1>
                <p style="color:#94a3b8; font-size:13px; margin-top:4px;">Manage user withdrawals, verify IPs and check stats</p>
            </div>
            <button class="refresh-btn" onclick="loadAdminData()">🔄 Refresh Data</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Date & IP</th>
                        <th>Registered Phone</th>
                        <th>Withdraw Details</th>
                        <th>Amount</th>
                        <th>User Total Success</th>
                        <th>Action / Status</th>
                    </tr>
                </thead>
                <tbody id="requestsTable">
                    <tr><td colspan="6" style="text-align:center; padding: 30px;">Loading withdraw requests...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadAdminData() {
            try {
                const res = await fetch('/api/admin-get-withdraws');
                const data = await res.json();
                const tbody = document.getElementById('requestsTable');
                tbody.innerHTML = '';

                if (!data.withdraws || data.withdraws.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 30px; color:#94a3b8;">No Withdraw Requests Found</td></tr>';
                    return;
                }

                data.withdraws.slice().reverse().forEach(req => {
                    // Total successful withdraws for this specific registered phone
                    const userApproved = data.withdraws.filter(w => w.registeredPhone === req.registeredPhone && w.status === 'Approved');
                    const totalSuccessAmount = userApproved.reduce((sum, w) => sum + Number(w.amount), 0);

                    let actionHtml = '';
                    if (req.status === 'Pending' || !req.status) {
                        actionHtml = `
                            <button class="btn-approve" onclick="updateStatus('${req.id}', 'Approved')">Approve</button>
                            <button class="btn-reject" onclick="updateStatus('${req.id}', 'Rejected')">Reject</button>
                        `;
                    } else {
                        actionHtml = `<span class="status-badge status-${req.status}">${req.status}</span>`;
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td><small style="color:#94a3b8;">${req.date || 'N/A'}</small><br><span class="ip-badge">IP: ${req.userIp || '127.0.0.1'}</span></td>
                            <td><b>${req.registeredPhone}</b></td>
                            <td>
                                <b>${req.accountName}</b> (${req.accountNumber})<br>
                                <span style="color:#60a5fa; font-size:12px; font-weight:bold;">${req.method}</span>
                            </td>
                            <td style="color:#10b981; font-weight:bold; font-size:15px;">PKR ${req.amount}</td>
                            <td><b style="color:#3b82f6;">PKR ${totalSuccessAmount}</b> <span style="color:#94a3b8; font-size:12px;">(${userApproved.length} Approved)</span></td>
                            <td>${actionHtml}</td>
                        </tr>
                    `;
                });
            } catch (e) {
                alert("Error loading requests. Server route unavailable.");
            }
        }

        async function updateStatus(id, status) {
            if (!confirm(`Are you sure you want to ${status} this request?`)) return;
            try {
                const res = await fetch('/api/admin-update-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, status })
                });
                const data = await res.json();
                if (data.success) {
                    loadAdminData();
                } else {
                    alert("Failed to update request");
                }
            } catch (e) {
                alert("Server Error");
            }
        }

        loadAdminData();
    </script>
</body>
</html>
